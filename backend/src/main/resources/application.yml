server:
  port: ${SERVER_PORT:7001}

spring:
  aop:
    proxy-target-class: false
  application:
    name: pdfserver

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:7003}/${POSTGRES_DB:auth_pdf_db}
    username: ${POSTGRES_USER:mrcool}
    password: ${POSTGRES_PASSWORD:StrongPassword!123}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        "[format_sql]": true

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:7004}
      password: ${REDIS_PASSWORD:}

minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:7005}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:StrongMinioPassword!123}
  bucket-name: ${MINIO_BUCKET_NAME:pdf-documents}

jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 hours
  refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000} # 7 days

  docker:
    compose:
      enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

scalar:
  path: /scalar
  enabled: true
  url: /v3/api-docs
  page-title: Auth & PDF Server - Scalar API Reference
  theme: deepSpace
  layout: modern
  show-sidebar: true
